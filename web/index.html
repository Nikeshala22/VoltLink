<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoltLink — Smart Solar Microgrid Trading</title>
    <meta
      name="description"
      content="Back-office and grid operator console for the VoltLink microgrid trading system."
    />
    <!--
      Colours the browser chrome around the page on the platforms that honour
      it, so the address bar matches the theme rather than staying white.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c18" />
    <!--
      Applies the saved theme before the first paint. Without this the page
      renders in light mode for a moment and then flips, which is a visible
      flash for anyone using dark mode.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('voltlink.theme');
          var wantsDark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);

          if (wantsDark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = wantsDark ? 'dark' : 'light';
        } catch (e) {
          /* Storage blocked: the app falls back to the light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
